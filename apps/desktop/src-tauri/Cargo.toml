[package]
name = "echomind"
version = "0.1.0"
description = "EchoMind 会议纪要助手"
authors = ["evanbyte"]
edition = "2021"
rust-version = "1.85"

[lib]
# The _lib suffix keeps the lib and bin names apart (a cargo limitation on Windows).
name = "echomind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# The desktop records and transcribes in sidecars.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
# A second launch (easy on Windows) would fight the first over the sign-in port and the recording.
tauri-plugin-single-instance = "2"
# Feishu API calls. native-tls uses the system TLS (Security.framework / SChannel).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "charset", "http2", "system-proxy"] }

# Phones transcribe in process: an app there cannot start other programs. Android has no
# system TLS that Rust can link, so the phone uses rustls with Mozilla's roots (see net.rs).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
echomind-transcriber = { path = "../../../native/transcriber", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
