<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMind</title>
    <script>
      (() => {
        const d = document.documentElement;
        d.classList.add("js");
        let t = "system";
        try { t = localStorage.getItem("echomind-theme") || "system"; } catch {}
        const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        d.classList.toggle("dark", dark);
        d.style.colorScheme = dark ? "dark" : "light";
        // In the app, the floating recorder is its own window ("recorder"); route it by label.
        const tauri = window.__TAURI_INTERNALS__;
        if (tauri && tauri.metadata && tauri.metadata.currentWindow.label === "recorder") history.replaceState(null, "", "#/recorder");
        if (location.hash.startsWith("#/recorder")) d.classList.add("recorder-window");
        if (navigator.userAgent.includes("Mac")) d.classList.add("platform-mac");
        else if (navigator.userAgent.includes("Windows")) d.classList.add("platform-win");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
